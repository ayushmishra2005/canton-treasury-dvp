[package]
name = "canton-treasury-dvp-bridge"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
default-run = "canton-treasury-dvp-bridge"

[dependencies]
anyhow = "1.0.98"
base64 = "0.22.1"
borsh = "0.10.3"
bytemuck = "1.23.0"
bincode = "1.3.3"
canton-treasury-dvp-devnet-zk = { path = "devnet-zk" }
clap = { version = "4.5.40", features = ["derive", "env"] }
hex = "0.4.3"
rand = "0.8.5"
reqwest = { version = "0.12.20", default-features = false, features = ["json", "rustls-tls", "blocking"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
solana-client = "2.2.7"
solana-sdk = "2.2.1"
solana-system-interface = "1.0.0"
spl-token-2022 = { version = "7.0.0", features = ["no-entrypoint"] }
spl-token-confidential-transfer-proof-extraction = "0.2.1"
zeroize = "1.8.1"

[dev-dependencies]
libc = "0.2"
tempfile = "3.20.0"
