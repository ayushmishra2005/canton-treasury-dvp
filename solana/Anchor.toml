[toolchain]
anchor_version = "0.31.1"

[features]
resolution = true
skip-lint = false

[programs.localnet]
confidential_escrow = "9Yuvt4HxfbGCL9gPk3ygMLV3UdrMFgAJsyhdoJvbKcUD"

# Devnet uses a newly generated ignored keypair. Record only the public
# program ID here after a real Devnet deploy. Do not reuse the localnet ID.

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[workspace]
members = ["programs/confidential-escrow"]
