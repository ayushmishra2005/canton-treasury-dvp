[package]
name = "confidential-escrow"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "lib"]
name = "confidential_escrow"

[features]
default = []
devnet-id = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
spl-token-2022 = { version = "7.0.0", features = ["no-entrypoint"] }

[dev-dependencies]
solana-program = "2.1.21"
solana-program-test = "2.1.21"
solana-sdk = "2.1.21"
sha2 = "0.10"
borsh = "0.10.3"
ed25519-dalek = { version = "2.1.1", features = ["rand_core"] }
tokio = { version = "1.45.1", features = ["macros", "rt-multi-thread"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(feature, values("anchor-debug", "cpi", "custom-heap", "custom-panic", "devnet-id", "idl-build", "no-entrypoint", "no-idl", "no-log-ix-name"))',
] }
